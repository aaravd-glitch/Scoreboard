<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Extra Qudrata V5 Scio quiz scoreboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for winning celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        pop: {
                            '0%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.08)' },
                            '100%': { transform: 'scale(1)' }
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 1 },
                            '50%': { opacity: 0.6 }
                        }
                    },
                    animation: {
                        pop: 'pop 0.25s ease-in-out',
                        pulseGlow: 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body.display-mode .controller-only { display: none !important; }
        body.display-mode #timerControls { display: none !important; }
        body.display-mode #displayModeBadge { display: inline-flex !important; }
        body.control-mode #controlModeBadge { display: inline-flex !important; }
        #displayModeBadge, #controlModeBadge { display: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col selection:bg-indigo-500 selection:text-white">

    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 shadow-xl">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 ring-1 ring-white/20">
                    <i class="fa-solid fa-graduation-cap text-white text-base"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-xs sm:text-lg tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-200 to-indigo-400">Extra Qudrata V5 Scio</h1>
                    <div class="flex items-center space-x-1.5">
                        <span id="syncIndicator" class="w-2 h-2 rounded-full bg-amber-500 animate-pulseGlow"></span>
                        <span id="syncText" class="text-[10px] text-slate-400 font-medium">Connecting...</span>
                        <span id="controlModeBadge" class="ml-2 px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-300 text-[9px] font-bold">PHONE CONTROLLER</span>
                        <span id="displayModeBadge" class="ml-2 px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 text-[9px] font-bold">LAPTOP SCOREBOARD</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <div class="bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 flex items-center space-x-1 text-[11px] font-semibold">
                    <button onclick="switchMode('control')" id="btnModeControl" class="px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white">Phone</button>
                    <button onclick="switchMode('display')" id="btnModeDisplay" class="px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white">Laptop</button>
                </div>

                <button onclick="triggerVictoryCelebration()" class="controller-only px-3 py-1.5 text-xs font-bold rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white transition shadow-md shadow-orange-500/20 flex items-center space-x-1.5">
                    <i class="fa-solid fa-award"></i>
                    <span class="hidden sm:inline">Party</span>
                </button>
                <button onclick="resetAllScores()" class="controller-only px-3 py-1.5 text-xs font-bold rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 transition flex items-center space-x-1.5 border border-rose-500/30">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span class="hidden sm:inline">Reset</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 grid grid-cols-1 lg:grid-cols-4 gap-4">
        
        <div class="lg:col-span-3 space-y-4">
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-3.5 shadow-xl backdrop-blur-sm flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-slate-800 rounded-xl text-indigo-400 ring-1 ring-slate-700/50">
                        <i class="fa-solid fa-stopwatch text-lg"></i>
                    </div>
                    <div>
                        <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Quiz Timer</div>
                        <div id="timerDisplay" class="text-2xl font-black font-mono tracking-widest text-white">00:00</div>
                    </div>
                </div>
                <div id="timerControls" class="flex items-center space-x-2 controller-only">
                    <button id="timerToggleBtn" onclick="toggleTimer()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-md flex items-center space-x-1.5">
                        <i class="fa-solid fa-play" id="timerIcon"></i>
                        <span id="timerText">Start</span>
                    </button>
                    <button onclick="resetTimer()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs transition border border-slate-700" title="Reset Timer">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>
            </div>

            <div id="teamsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
        </div>

        <div class="lg:col-span-1 space-y-4 flex flex-col">
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-3.5 shadow-xl backdrop-blur-sm">
                <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-800">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-200 flex items-center space-x-2">
                        <i class="fa-solid fa-ranking-star text-amber-400"></i>
                        <span>Live Standings</span>
                    </h3>
                </div>
                <div id="leaderboardList" class="space-y-1.5"></div>
            </div>

            <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-3.5 shadow-xl backdrop-blur-sm flex-1 flex flex-col min-h-[260px]">
                <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-800">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-200 flex items-center space-x-2">
                        <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i>
                        <span>Activity Stream</span>
                    </h3>
                    <button onclick="clearHistoryLog()" class="controller-only text-[10px] text-slate-400 hover:text-slate-200 transition underline">Clear</button>
                </div>
                
                <div id="historyLogContainer" class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[300px] lg:max-h-[420px]">
                    <div class="text-center py-6 text-slate-500 text-xs italic">Connecting to live sync stream...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Custom Point Input Modal -->
    <div id="customPointModal" class="controller-only fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 shadow-2xl relative animate-pop">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-white">Custom Point Adjustment</h3>
                <button onclick="closeCustomPointModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            
            <form onsubmit="handleCustomPointSubmit(event)" class="space-y-3.5">
                <input type="hidden" id="customPointTeamId">
                <div>
                    <label id="customPointTeamLabel" class="block text-xs font-medium text-indigo-400 mb-1.5">Adjusting score</label>
                    <input type="number" id="customPointValue" required placeholder="e.g. 12 or -4" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-base font-bold text-white focus:outline-none focus:border-indigo-500 shadow-inner">
                </div>
                <div class="flex items-center justify-end space-x-2.5 pt-1">
                    <button type="button" onclick="closeCustomPointModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow-lg">Apply</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Team Name Modal -->
    <div id="editTeamModal" class="controller-only fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 shadow-2xl relative animate-pop">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-white">Edit Team Name</h3>
                <button onclick="closeEditTeamModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            
            <form onsubmit="handleEditTeamSubmit(event)" class="space-y-3.5">
                <input type="hidden" id="editTeamIndex">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Team Name</label>
                    <input type="text" id="editTeamNameInput" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-bold text-white focus:outline-none focus:border-indigo-500 shadow-inner">
                </div>
                <div class="flex items-center justify-end space-x-2.5 pt-1">
                    <button type="button" onclick="closeEditTeamModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow-lg">Save Name</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 bg-slate-900 border border-slate-800 text-white px-3.5 py-2.5 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-2.5">
        <div class="w-5 h-5 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-[10px]">
            <i class="fa-solid fa-bell"></i>
        </div>
        <div id="toastMessage" class="text-xs font-medium">Notification</div>
    </div>

    <script type="module">
        const urlParams = new URLSearchParams(window.location.search);
        let QUIZ_MODE = urlParams.get('mode') === 'control' ? 'control' : 'display'; 
        const QUIZ_ROOM = (urlParams.get('room') || 'extraqudrata-v5').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40) || 'extraqudrata-v5';
        
        applyModeUI();

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const baseAppId = typeof __app_id !== 'undefined' ? __app_id : 'extra-qudrata-v5-scio-quiz';
        const appId = `${baseAppId}-${QUIZ_ROOM}`;
        const firebaseConfig = {
            apiKey: "AIzaSyDtT-YQ9VJue5LVupMqzGhjKKFzUdG12Qo",
            authDomain: "scoreboard-67.firebaseapp.com",
            projectId: "scoreboard-67",
            storageBucket: "scoreboard-67.firebasestorage.app",
            messagingSenderId: "574082570301",
            appId: "1:574082570301:web:aaf8c1b6a38f515ec9f254",
            measurementId: "G-ML7R5W8H88"
        };

        let app, db, auth, userId = null;
        let isRemoteUpdate = false; // Flag to prevent cyclic update loops

        let state = {
            teams: [
                { id: 'teamA', name: 'Team A', score: 0, gradient: 'from-indigo-600/20 to-purple-600/10', border: 'border-indigo-500/40', badge: 'bg-indigo-500' },
                { id: 'teamB', name: 'Team B', score: 0, gradient: 'from-blue-600/20 to-cyan-600/10', border: 'border-blue-500/40', badge: 'bg-blue-500' },
                { id: 'teamC', name: 'Team C', score: 0, gradient: 'from-emerald-600/20 to-teal-600/10', border: 'border-emerald-500/40', badge: 'bg-emerald-500' },
                { id: 'teamD', name: 'Team D', score: 0, gradient: 'from-amber-600/20 to-orange-600/10', border: 'border-amber-500/40', badge: 'bg-amber-500' }
            ],
            history: [],
            timerSeconds: 0,
            timerInterval: null,
            isTimerRunning: false
        };

        window.switchMode = function(mode) {
            QUIZ_MODE = mode;
            const newUrl = `${window.location.pathname}?mode=${mode}&room=${QUIZ_ROOM}`;
            window.history.replaceState({}, '', newUrl);
            applyModeUI();
            renderTeams();
            showToast(`Switched to ${mode === 'control' ? 'Phone Controller' : 'Laptop Scoreboard'} mode`);
        };

        function applyModeUI() {
            document.body.classList.remove('display-mode', 'control-mode');
            document.body.classList.add(QUIZ_MODE === 'display' ? 'display-mode' : 'control-mode');
            document.title = QUIZ_MODE === 'display' ? 'Extra Qudrata V5 — LAPTOP SCOREBOARD' : 'Extra Qudrata V5 — PHONE CONTROLLER';
            
            const btnCtrl = document.getElementById('btnModeControl');
            const btnDisp = document.getElementById('btnModeDisplay');
            if (QUIZ_MODE === 'control') {
                btnCtrl.className = "px-2.5 py-1 rounded-lg transition bg-indigo-600 text-white font-bold shadow";
                btnDisp.className = "px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white";
            } else {
                btnDisp.className = "px-2.5 py-1 rounded-lg transition bg-emerald-600 text-white font-bold shadow";
                btnCtrl.className = "px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white";
            }
        }

        window.onload = async function() {
            renderTeams();
            renderLeaderboard();
            renderHistoryLog();

            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                userId = auth.currentUser?.uid || crypto.randomUUID();
                
                setupFirestoreSync();
            } catch (err) {
                console.warn("Cloud sync running in local fallback mode:", err);
                document.getElementById('syncIndicator').className = "w-2 h-2 rounded-full bg-rose-500";
                document.getElementById('syncText').innerText = "Offline Mode";
                addHistoryLog("Running in local session mode.");
            }
        };

        function setupFirestoreSync() {
            if (!db) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'quiz_state_v5');

            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    isRemoteUpdate = true;
                    const data = docSnap.data();
                    if (data.teams) {
                        state.teams = data.teams;
                    }
                    if (data.history) {
                        state.history = data.history;
                    }
                    if (typeof data.timerSeconds === 'number') {
                        state.timerSeconds = data.timerSeconds;
                        updateTimerDisplay();
                    }
                    renderTeams();
                    renderLeaderboard();
                    renderHistoryLog();
                    isRemoteUpdate = false;
                } else {
                    saveStateToCloud();
                }
                document.getElementById('syncIndicator').className = "w-2 h-2 rounded-full bg-emerald-500";
                document.getElementById('syncText').innerText = "Live Synced";
            }, (error) => {
                console.error("Firestore sync error:", error);
                document.getElementById('syncIndicator').className = "w-2 h-2 rounded-full bg-amber-500";
                document.getElementById('syncText').innerText = "Sync Warning";
            });
        }

        async function saveStateToCloud() {
            if (!db || isRemoteUpdate) return; 
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'quiz_state_v5');
                await setDoc(docRef, {
                    teams: state.teams,
                    history: state.history.slice(0, 40),
                    timerSeconds: state.timerSeconds,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (e) {
                console.error("Error saving state:", e);
            }
        }

        window.toggleTimer = function() {
            if (QUIZ_MODE !== 'control') return;
            const btn = document.getElementById('timerToggleBtn');
            const icon = document.getElementById('timerIcon');
            const text = document.getElementById('timerText');

            if (state.isTimerRunning) {
                clearInterval(state.timerInterval);
                state.isTimerRunning = false;
                btn.className = "px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-md flex items-center space-x-1.5";
                icon.className = "fa-solid fa-play";
                text.innerText = "Start";
                addHistoryLog("Quiz timer paused.");
            } else {
                state.isTimerRunning = true;
                btn.className = "px-3.5 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-bold transition shadow-md flex items-center space-x-1.5";
                icon.className = "fa-solid fa-pause";
                text.innerText = "Pause";
                addHistoryLog("Quiz timer started.");

                state.timerInterval = setInterval(() => {
                    state.timerSeconds++;
                    updateTimerDisplay();
                    saveStateToCloud();
                }, 1000);
            }
            saveStateToCloud();
        };

        window.resetTimer = function() {
            if (QUIZ_MODE !== 'control') return;
            clearInterval(state.timerInterval);
            state.isTimerRunning = false;
            state.timerSeconds = 0;
            updateTimerDisplay();
            const btn = document.getElementById('timerToggleBtn');
            btn.className = "px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-md flex items-center space-x-1.5";
            document.getElementById('timerIcon').className = "fa-solid fa-play";
            document.getElementById('timerText').innerText = "Start";
            addHistoryLog("Quiz timer reset.");
            saveStateToCloud();
        };

        function updateTimerDisplay() {
            const mins = Math.floor(state.timerSeconds / 60);
            const secs = state.timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function renderTeams() {
            const container = document.getElementById('teamsContainer');
            container.innerHTML = '';

            state.teams.forEach(team => {
                const card = document.createElement('div');
                card.className = `bg-gradient-to-br ${team.gradient} bg-slate-900/95 border ${team.border} rounded-2xl p-4 shadow-xl relative overflow-hidden transition`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2.5 pb-2 border-b border-slate-800">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full ${team.badge} shadow-md inline-block"></span>
                            <h3 class="font-extrabold text-sm sm:text-base text-white tracking-tight">${escapeHtml(team.name)}</h3>
                        </div>
                        <div class="flex items-center space-x-1 controller-only">
                            <button onclick="resetTeamScore('${team.id}')" class="px-2 py-1 text-[10px] font-bold text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition border border-slate-700/50">
                                Reset 0
                            </button>
                            <button onclick="openEditTeamModal('${team.id}')" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between my-3">
                        <div>
                            <div class="text-[9px] uppercase font-bold text-slate-400 tracking-wider">Score</div>
                            <div id="score-val-${team.id}" class="text-3xl sm:text-5xl font-black font-mono tracking-tight text-white">${team.score}</div>
                        </div>
                        <button onclick="openCustomPointModal('${team.id}')" class="controller-only px-3 py-2 bg-slate-800/90 hover:bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700 transition flex items-center space-x-1 shadow-sm">
                            <i class="fa-solid fa-calculator text-indigo-400"></i>
                            <span>Custom</span>
                        </button>
                    </div>

                    <div class="space-y-1 controller-only">
                        <div class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Point Increments</div>
                        <div class="grid grid-cols-7 gap-1 mb-1">
                            <button onclick="updateScore('${team.id}', 2)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-emerald-600/30 border border-slate-700 hover:border-emerald-500/50 text-emerald-400 font-bold rounded text-xs transition active:scale-95">+2</button>
                            <button onclick="updateScore('${team.id}', 3)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-emerald-600/30 border border-slate-700 hover:border-emerald-500/50 text-emerald-400 font-bold rounded text-xs transition active:scale-95">+3</button>
                            <button onclick="updateScore('${team.id}', 5)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-emerald-600/30 border border-slate-700 hover:border-emerald-500/50 text-emerald-400 font-bold rounded text-xs transition active:scale-95">+5</button>
                            <button onclick="updateScore('${team.id}', 7)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-emerald-600/30 border border-slate-700 hover:border-emerald-500/50 text-emerald-400 font-bold rounded text-xs transition active:scale-95">+7</button>
                            <button onclick="updateScore('${team.id}', 10)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-emerald-600/30 border border-slate-700 hover:border-emerald-500/50 text-emerald-400 font-bold rounded text-xs transition active:scale-95">+10</button>
                            <button onclick="updateScore('${team.id}', 15)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-emerald-600/30 border border-slate-700 hover:border-emerald-500/50 text-emerald-400 font-bold rounded text-xs transition active:scale-95">+15</button>
                            <button onclick="updateScore('${team.id}', 20)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-emerald-600/30 border border-slate-700 hover:border-emerald-500/50 text-emerald-400 font-bold rounded text-xs transition active:scale-95">+20</button>
                        </div>
                        <div class="grid grid-cols-6 gap-1">
                            <button onclick="updateScore('${team.id}', -1)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-rose-600/30 border border-slate-700 hover:border-rose-500/50 text-rose-400 font-bold rounded text-xs transition active:scale-95">-1</button>
                            <button onclick="updateScore('${team.id}', -2)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-rose-600/30 border border-slate-700 hover:border-rose-500/50 text-rose-400 font-bold rounded text-xs transition active:scale-95">-2</button>
                            <button onclick="updateScore('${team.id}', -3)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-rose-600/30 border border-slate-700 hover:border-rose-500/50 text-rose-400 font-bold rounded text-xs transition active:scale-95">-3</button>
                            <button onclick="updateScore('${team.id}', -4)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-rose-600/30 border border-slate-700 hover:border-rose-500/50 text-rose-400 font-bold rounded text-xs transition active:scale-95">-4</button>
                            <button onclick="updateScore('${team.id}', -5)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-rose-600/30 border border-slate-700 hover:border-rose-500/50 text-rose-400 font-bold rounded text-xs transition active:scale-95">-5</button>
                            <button onclick="updateScore('${team.id}', -10)" class="py-1.5 px-0.5 bg-slate-800/80 hover:bg-rose-600/30 border border-slate-700 hover:border-rose-500/50 text-rose-400 font-bold rounded text-xs transition active:scale-95">-10</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.updateScore = function(teamId, delta) {
            if (QUIZ_MODE !== 'control') return;
            const team = state.teams.find(t => t.id === teamId);
            if (!team) return;

            team.score += delta;
            
            const scoreEl = document.getElementById(`score-val-${teamId}`);
            if (scoreEl) {
                scoreEl.classList.remove('animate-pop');
                void scoreEl.offsetWidth;
                scoreEl.classList.add('animate-pop');
            }

            const actionDesc = `${team.name} scored ${delta > 0 ? '+' + delta : delta} pts (Total: ${team.score})`;
            addHistoryLog(actionDesc);
            
            if (delta > 0) {
                triggerMiniConfetti();
            }

            renderTeams();
            renderLeaderboard();
            showToast(actionDesc);
            saveStateToCloud();
        };

        window.resetTeamScore = function(teamId) {
            if (QUIZ_MODE !== 'control') return;
            const team = state.teams.find(t => t.id === teamId);
            if (!team) return;
            team.score = 0;
            addHistoryLog(`${team.name} score reset to 0.`);
            renderTeams();
            renderLeaderboard();
            showToast(`${team.name} score reset`);
            saveStateToCloud();
        };

        function renderLeaderboard() {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';

            const sorted = [...state.teams].sort((a, b) => b.score - a.score);

            sorted.forEach((team, index) => {
                const rankColor = index === 0 ? 'text-amber-400 bg-amber-500/10 border-amber-500/30' : 
                                  index === 1 ? 'text-slate-200 bg-slate-800/60 border-slate-700' : 
                                  index === 2 ? 'text-amber-600 bg-amber-900/20 border-amber-800/40' : 'text-slate-500 bg-slate-950 border-slate-900';
                
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2 rounded-xl border ${rankColor}`;
                item.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="w-4 h-4 rounded-full flex items-center justify-center text-[9px] font-bold ${index === 0 ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-200'}">#${index + 1}</span>
                        <span class="text-xs font-bold text-white truncate max-w-[120px]">${escapeHtml(team.name)}</span>
                    </div>
                    <span class="font-mono font-bold text-xs text-white">${team.score} pts</span>
                `;
                list.appendChild(item);
            });
        }

        function addHistoryLog(text) {
            const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            state.history.unshift({ text, time: timeStr });
            if (state.history.length > 40) state.history.pop();
            renderHistoryLog();
        }

        function renderHistoryLog() {
            const container = document.getElementById('historyLogContainer');
            container.innerHTML = '';

            if (state.history.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs italic">No activity recorded yet.</div>`;
                return;
            }

            state.history.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-2 rounded-xl bg-slate-950/60 border border-slate-800/80 text-[11px] space-y-0.5";
                div.innerHTML = `
                    <div class="flex items-center justify-between text-[9px] text-slate-400">
                        <span><i class="fa-regular fa-clock mr-1"></i>${item.time}</span>
                    </div>
                    <p class="text-slate-200 font-medium">${escapeHtml(item.text)}</p>
                `;
                container.appendChild(div);
            });
        }

        window.clearHistoryLog = function() {
            if (QUIZ_MODE !== 'control') return;
            state.history = [];
            renderHistoryLog();
            showToast("Activity history cleared.");
            saveStateToCloud();
        };

        window.resetAllScores = function() {
            if (QUIZ_MODE !== 'control') return;
            if (!confirm("Are you sure you want to reset all team scores to 0?")) return;
            state.teams.forEach(t => t.score = 0);
            addHistoryLog("Match reset: all team scores set to 0.");
            renderTeams();
            renderLeaderboard();
            showToast("All match scores reset");
            saveStateToCloud();
        };

        window.openEditTeamModal = function(teamId) {
            if (QUIZ_MODE !== 'control') return;
            const team = state.teams.find(t => t.id === teamId);
            if (!team) return;
            document.getElementById('editTeamIndex').value = team.id;
            document.getElementById('editTeamNameInput').value = team.name;
            document.getElementById('editTeamModal').classList.remove('hidden');
            document.getElementById('editTeamModal').classList.add('flex');
        };

        window.closeEditTeamModal = function() {
            document.getElementById('editTeamModal').classList.remove('flex');
            document.getElementById('editTeamModal').classList.add('hidden');
        };

        window.handleEditTeamSubmit = function(e) {
            if (QUIZ_MODE !== 'control') return;
            e.preventDefault();
            const id = document.getElementById('editTeamIndex').value;
            const name = document.getElementById('editTeamNameInput').value.trim();
            if (!name) return;

            const team = state.teams.find(t => t.id === id);
            if (team) {
                team.name = name;
                addHistoryLog(`Team renamed to: ${name}`);
                showToast(`Renamed to ${name}`);
            }

            closeEditTeamModal();
            renderTeams();
            renderLeaderboard();
            saveStateToCloud();
        };

        window.openCustomPointModal = function(teamId) {
            if (QUIZ_MODE !== 'control') return;
            const team = state.teams.find(t => t.id === teamId);
            if (!team) return;
            document.getElementById('customPointTeamId').value = team.id;
            document.getElementById('customPointTeamLabel').innerText = `Adjusting score for ${team.name}`;
            document.getElementById('customPointValue').value = "";
            document.getElementById('customPointModal').classList.remove('hidden');
            document.getElementById('customPointModal').classList.add('flex');
        };

        window.closeCustomPointModal = function() {
            document.getElementById('customPointModal').classList.remove('flex');
            document.getElementById('customPointModal').classList.add('hidden');
        };

        window.handleCustomPointSubmit = function(e) {
            if (QUIZ_MODE !== 'control') return;
            e.preventDefault();
            const teamId = document.getElementById('customPointTeamId').value;
            const val = parseInt(document.getElementById('customPointValue').value);
            if (isNaN(val)) return;

            closeCustomPointModal();
            updateScore(teamId, val);
        };

        window.triggerVictoryCelebration = function() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
            showToast("🎉 Celebration triggered!");
            addHistoryLog("Victory celebration triggered.");
        };

        function triggerMiniConfetti() {
            confetti({
                particleCount: 40,
                spread: 50,
                origin: { y: 0.7 }
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
